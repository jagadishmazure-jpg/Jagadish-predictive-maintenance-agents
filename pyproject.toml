[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predictive-maintenance-agents"
version = "0.1.0"
description = "End-to-end manufacturing asset reliability agents (synthetic data)"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["predmaint"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
